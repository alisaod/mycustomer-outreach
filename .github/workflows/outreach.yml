name: MyCustomer 24-7 Cloud Outreach

on:
  schedule:
    # يعمل تلقائياً كل 30 دقيقة على مدار 24 ساعة حتى والحاسوب والهاتف مغلقان
    - cron: '*/30 * * * *'
  workflow_dispatch: # يتيح التشغيل اليدوي الفوري بضغطة زر

concurrency:
  group: mycustomer-outreach-singleton
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Autonomous Cloud Outreach Cycle
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          WEBAPP_BASE: ${{ secrets.WEBAPP_BASE }}
        run: python cloud_outreach_runner.py
